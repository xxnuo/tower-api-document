services:
  agents-tower:
    image: registry.lazycat.cloud/x/agentstower:${AGENTSTOWER_TAG:-latest}
    container_name: agents-tower
    restart: unless-stopped
    ports:
      - "8888:8888"
    env_file:
      - ./server/.env
    environment:
      LISTEN_ADDR: "[::]:8888"
      DB_PATH: "/app/data/data.db"
    volumes:
      - ./server/data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8888/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
